#ONLY USE WHEN NOT USING INTELLIJ GUI

version: '3.8'

services:
  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patient-service-app
    ports:
      - "4000:4000"
    depends_on:
      patient-service-db:
        condition: service_healthy # This line is the key addition
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://patient-service-db:5432/patient_service_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    networks:
      - patient-service-network

  patient-service-db:
    image: postgres:15.6
    container_name: patient-service-db
    environment:
      - POSTGRES_DB=patient_service_db
      - POSTGRES_USER=admin_user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - patient-service-data:/var/lib/postgresql/data
    networks:
      - patient-service-network
    healthcheck: # This is the healthcheck block
      test: [ "CMD-SHELL", "pg_isready -U user -d patient_service_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  patient-service-network:
    driver: bridge

volumes:
  patient-service-data:
