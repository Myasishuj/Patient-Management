# ==============================================
# SERVER CONFIGURATION
# ==============================================
server:
  port: 4004  # The API Gateway will start on port 4004 instead of the default 8080

# ==============================================
# SPRING CLOUD GATEWAY CONFIGURATION
# ==============================================
spring:
  cloud:
    gateway:
      server:
        webflux:  # Enables reactive (non-blocking) WebFlux routing
          routes:  # List of routing rules for the API Gateway
            - id: auth-service
              uri: http://auth-service:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            # ----------------------------------
            # 1️⃣ Route to the Patient Service API
            # ----------------------------------
            - id: patient-service-route  # Unique ID for this route
              uri: http://patient-service:4000  # Target microservice to forward requests
                # "patient-service" = service name in Docker Compose
              # ":4000" = internal port exposed by that service

              predicates:
                - Path=/api/patients/**  # Matches requests starting with /api/patients/
                # Forwards them to the "patient-service" microservice

              filters:
                - StripPrefix=1  # Removes the first path segment (/api)
                  # Example:
                  #   Incoming:  /api/patients/getAll
                #   Forwarded: /patients/getAll

            # ----------------------------------
            # 2️⃣ Route for API documentation (Swagger)
            # ----------------------------------
            - id: api-docs-patient-route  # Route for serving OpenAPI/Swagger docs
              uri: http://patient-service:4000  # Same patient-service backend

              predicates:
                - Path=/api-docs/patients  # Matches /api-docs/patients requests

              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs
                  # Rewrites the path before forwarding
                  # Example:
                  #   Incoming:  /api-docs/patients
                  #   Forwarded: /v3/api-docs
                # Enables accessing Swagger UI through the gateway
